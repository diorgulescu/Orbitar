# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "orbitar-desktop"
version = "1.0.0"
description = "Orbitar — Planetariu Didactic Interactiv în Limba Română (6–12 ani)"
authors = ["Dragoş Iorgulescu <32508790+diorgulescu@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/diorgulescu/Orbitar"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.1.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

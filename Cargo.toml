# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/orbitar-core",
    "crates/orbitar-gdext",
]
exclude = [
    "src-tauri",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Dragoş Iorgulescu <32508790+diorgulescu@users.noreply.github.com>"]
repository = "https://github.com/diorgulescu/Orbitar"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.29", features = ["serde"] }
godot = { version = "0.2", features = ["api-4-3"] }
